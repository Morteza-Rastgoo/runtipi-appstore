# Infer: SGLang (lmsysorg/sglang:v0.5.23-cu130) - generated by the engine-bakeoff app generator
# Loopback-only API, NVIDIA MPS client (uid 1000), read-only model mounts, never auto-restarts.
services:
  infer-sglang:
    image: lmsysorg/sglang:v0.5.23-cu130
    container_name: infer-sglang
    restart: "no"
    user: "1000:1000"
    ipc: host
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "TPL=(); if [ -n \"$${CHAT_TEMPLATE}\" ] && [ \"$${CHAT_TEMPLATE}\" != none ]; then TPL=(--chat-template \"$${CHAT_TEMPLATE}\"); fi; SPEC=(); if [ \"$${SPEC_TOKENS:-0}\" -gt 0 ]; then SPEC=(--speculative-algorithm NEXTN --speculative-num-steps \"$${SPEC_TOKENS}\" --speculative-eagle-topk 1 --speculative-num-draft-tokens \"$$(($${SPEC_TOKENS}+1))\"); fi; OFF=(); if [ \"$${KV_CPU_GB:-0}\" -gt 0 ]; then OFF=(--enable-hierarchical-cache --hicache-size \"$${KV_CPU_GB}\" --hicache-write-policy write_through); fi; exec python3 -m sglang.launch_server --model-path \"$${MODEL}\" --served-model-name \"$${SERVED_NAME}\" --host 0.0.0.0 --port 30000 --mem-fraction-static \"$${GPU_FRAC}\" --context-length \"$${MAX_LEN}\" --max-running-requests \"$${MAX_SEQS}\" --chunked-prefill-size 16384 --kv-cache-dtype fp8_e4m3 --enable-metrics --enable-cache-report --enable-priority-scheduling --tool-call-parser qwen3_coder --reasoning-parser qwen3 --trust-remote-code \"$${TPL[@]}\" \"$${SPEC[@]}\" \"$${OFF[@]}\" $${EXTRA_ARGS}"
    ports:
      - "127.0.0.1:${APP_PORT}:30000"
    environment:
      MODEL: "${MODEL}"
      SERVED_NAME: "${SERVED_NAME}"
      GPU_FRAC: "${GPU_FRAC}"
      MAX_LEN: "${MAX_LEN}"
      MAX_SEQS: "${MAX_SEQS}"
      SPEC_TOKENS: "${SPEC_TOKENS}"
      KV_CPU_GB: "${KV_CPU_GB}"
      EXTRA_ARGS: "${EXTRA_ARGS}"
      CHAT_TEMPLATE: "${CHAT_TEMPLATE}"
      HOME: "/data"
      HF_HOME: "/data/hf"
      XDG_CACHE_HOME: "/data/cache"
      HF_HUB_OFFLINE: "1"
      CUDA_MPS_PIPE_DIRECTORY: "/tmp/nvidia-mps"
      CUDA_MPS_PINNED_DEVICE_MEM_LIMIT: "${MPS_MEM_LIMIT}"
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: "${MPS_THREAD_PCT}"
      SGLANG_DISABLE_REQUEST_LOGGING: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - "${MODELS_DIR}:${MODELS_DIR}:ro"
      - "${APP_DATA_DIR}/data:/data"
      - "/tmp/nvidia-mps:/tmp/nvidia-mps"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    x-runtipi:
      is_main: true
      internal_port: 30000
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true

x-runtipi:
  schema_version: 2
