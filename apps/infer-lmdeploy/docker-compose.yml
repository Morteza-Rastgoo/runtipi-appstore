# Infer: LMDeploy (PyTorch engine) (openmmlab/lmdeploy:v0.18.0-cu13.0) - generated by the engine-bakeoff app generator
# Loopback-only API, NVIDIA MPS client (uid 1000), read-only model mounts, never auto-restarts.
services:
  infer-lmdeploy:
    image: openmmlab/lmdeploy:v0.18.0-cu13.0
    container_name: infer-lmdeploy
    restart: "no"
    user: "1000:1000"
    ipc: host
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "mkdir -p /data/shim && printf \"raise ImportError(\\\"FA3 has no sm_120 kernels\\\")\\n\" > /data/shim/flash_attn_interface.py; echo  | base64 -d > /data/shim/sitecustomize.py; export PYTHONPATH=/data/shim$${PYTHONPATH:+:$$PYTHONPATH}; SPEC=(); exec lmdeploy serve api_server \"$${MODEL}\" --backend pytorch --server-name 0.0.0.0 --server-port 23333 --model-name \"$${SERVED_NAME}\" --cache-max-entry-count \"$${GPU_FRAC}\" --session-len \"$${MAX_LEN}\" --max-batch-size \"$${MAX_SEQS}\" --enable-prefix-caching --max-prefill-token-num 16384 --quant-policy fp8 --tool-call-parser qwen3coder --reasoning-parser default \"$${SPEC[@]}\" $${EXTRA_ARGS}"
    ports:
      - "127.0.0.1:${APP_PORT}:23333"
    environment:
      MODEL: "${MODEL}"
      SERVED_NAME: "${SERVED_NAME}"
      GPU_FRAC: "${GPU_FRAC}"
      MAX_LEN: "${MAX_LEN}"
      MAX_SEQS: "${MAX_SEQS}"
      SPEC_TOKENS: "${SPEC_TOKENS}"
      KV_CPU_GB: "${KV_CPU_GB}"
      EXTRA_ARGS: "${EXTRA_ARGS}"
      CHAT_TEMPLATE: "${CHAT_TEMPLATE}"
      HOME: "/data"
      HF_HOME: "/data/hf"
      XDG_CACHE_HOME: "/data/cache"
      HF_HUB_OFFLINE: "1"
      CUDA_MPS_PIPE_DIRECTORY: "/tmp/nvidia-mps"
      CUDA_MPS_PINNED_DEVICE_MEM_LIMIT: "${MPS_MEM_LIMIT}"
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: "${MPS_THREAD_PCT}"
      DO_NOT_TRACK: "1"
      LMDEPLOY_BLOCKED_FP8_GEMM_BACKEND: "triton"
    volumes:
      - "${MODELS_DIR}:${MODELS_DIR}:ro"
      - "${APP_DATA_DIR}/data:/data"
      - "/tmp/nvidia-mps:/tmp/nvidia-mps"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    x-runtipi:
      is_main: true
      internal_port: 23333
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true

x-runtipi:
  schema_version: 2
