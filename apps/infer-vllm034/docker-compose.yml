# Infer: vLLM 0.34 (official) (vllm/vllm-openai:v0.34.0) - generated by the engine-bakeoff app generator
# Loopback-only API, NVIDIA MPS client (uid 1000), read-only model mounts, never auto-restarts.
services:
  infer-vllm034:
    image: vllm/vllm-openai:v0.34.0
    container_name: infer-vllm034
    restart: "no"
    user: "1000:1000"
    ipc: host
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "SPEC=(); if [ \"$${SPEC_TOKENS:-0}\" -gt 0 ]; then SPEC=(--speculative-config \"{\\\"method\\\":\\\"mtp\\\",\\\"num_speculative_tokens\\\":$${SPEC_TOKENS}}\"); fi; TPL=(); if [ -n \"$${CHAT_TEMPLATE}\" ] && [ \"$${CHAT_TEMPLATE}\" != none ]; then TPL=(--chat-template \"$${CHAT_TEMPLATE}\"); fi; OFF=(); if [ \"$${KV_CPU_GB:-0}\" -gt 0 ]; then OFF=(--kv-offloading-size \"$${KV_CPU_GB}\" --kv-offloading-backend native); fi; exec vllm serve \"$${MODEL}\" --served-model-name \"$${SERVED_NAME}\" --host 0.0.0.0 --port 8000 --gpu-memory-utilization \"$${GPU_FRAC}\" --max-model-len \"$${MAX_LEN}\" --max-num-seqs \"$${MAX_SEQS}\" --enable-prefix-caching --enable-chunked-prefill --max-num-batched-tokens 16384 --kv-cache-dtype fp8 --scheduling-policy priority --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --trust-remote-code \"$${TPL[@]}\" \"$${SPEC[@]}\" \"$${OFF[@]}\" $${EXTRA_ARGS}"
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    environment:
      MODEL: "${MODEL}"
      SERVED_NAME: "${SERVED_NAME}"
      GPU_FRAC: "${GPU_FRAC}"
      MAX_LEN: "${MAX_LEN}"
      MAX_SEQS: "${MAX_SEQS}"
      SPEC_TOKENS: "${SPEC_TOKENS}"
      KV_CPU_GB: "${KV_CPU_GB}"
      EXTRA_ARGS: "${EXTRA_ARGS}"
      CHAT_TEMPLATE: "${CHAT_TEMPLATE}"
      HOME: "/data"
      HF_HOME: "/data/hf"
      XDG_CACHE_HOME: "/data/cache"
      HF_HUB_OFFLINE: "1"
      CUDA_MPS_PIPE_DIRECTORY: "/tmp/nvidia-mps"
      CUDA_MPS_PINNED_DEVICE_MEM_LIMIT: "${MPS_MEM_LIMIT}"
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: "${MPS_THREAD_PCT}"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: "0"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - "${MODELS_DIR}:${MODELS_DIR}:ro"
      - "${APP_DATA_DIR}/data:/data"
      - "/tmp/nvidia-mps:/tmp/nvidia-mps"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    x-runtipi:
      is_main: true
      internal_port: 8000
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true

x-runtipi:
  schema_version: 2
