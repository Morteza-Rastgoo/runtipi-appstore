services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-app
    restart: unless-stopped
    networks:
      - tipi_main_network
    environment:
      MAIN_URL: ${MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${MAIN_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${MAIN_URL:-http://localhost:4007}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    ports:
      - ${APP_PORT}:5000
    volumes:
      - postiz-uploads:/uploads
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_started
      temporal-postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      generated: true
      traefik.enable: true
      traefik.http.middlewares.postiz-web-redirect.redirectscheme.scheme: https
      traefik.http.services.postiz.loadbalancer.server.port: "5000"
      traefik.http.routers.postiz-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.postiz-insecure.entrypoints: web
      traefik.http.routers.postiz-insecure.service: postiz
      traefik.http.routers.postiz-insecure.middlewares: postiz-web-redirect
      traefik.http.routers.postiz.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.postiz.entrypoints: websecure
      traefik.http.routers.postiz.service: postiz
      traefik.http.routers.postiz.tls.certresolver: myresolver
      runtipi.managed: true

  postiz-postgres:
    image: postgres:15-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    networks:
      - tipi_main_network
    environment:
      POSTGRES_DB: postiz-db-local
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: postiz-password
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 5s
      timeout: 3s
      retries: 10

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: unless-stopped
    networks:
      - tipi_main_network

  temporal-postgres:
    image: postgres:15-alpine
    container_name: temporal-postgres
    restart: unless-stopped
    networks:
      - tipi_main_network
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.0
    container_name: temporal
    restart: unless-stopped
    networks:
      - tipi_main_network
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_NAMESPACE: default
    depends_on:
      temporal-postgres:
        condition: service_healthy

volumes:
  postiz-uploads:
    driver: local
  postiz-postgres-data:
    driver: local
  temporal-postgres-data:
    driver: local

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true