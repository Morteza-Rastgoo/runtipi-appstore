services:
  warp-factory-worker:
    container_name: warp-factory-worker
    image: warpdotdev/oz-agent-worker:v2026-11-12-16-17-15
    user: "0"
    command: --worker-id ${WORKER_ID} --config-file /data/worker.yaml ${WARP_EXTRA_ARGS}
    environment:
      - WARP_API_KEY=${WARP_API_KEY}
      - WORKER_ID=${WORKER_ID}
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data:/data
    labels:
      runtipi.managed: true
