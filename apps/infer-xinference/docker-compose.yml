# Infer: Xinference (vLLM engine) (xprobe/xinference:v4.2.0) - generated by the engine-bakeoff app generator
# Loopback-only API, NVIDIA MPS client (uid 1000), read-only model mounts, never auto-restarts.
services:
  infer-xinference:
    image: xprobe/xinference:v4.2.0
    container_name: infer-xinference
    restart: "no"
    user: "1000:1000"
    ipc: host
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "export XINFERENCE_HOME=/data/xinference; xinference-local -H 0.0.0.0 -p 9997 --metrics-exporter-port 9998 & SRV=$$!; until python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:9997/v1/models', timeout=3)\" 2>/dev/null; do kill -0 $$SRV || exit 1; sleep 3; done; VP=(); if [ -n \"$${XINF_VLLM}\" ] && [ \"$${XINF_VLLM}\" != none ]; then VP=(-vp \"$${XINF_VLLM}\"); fi; xinference launch \"$${VP[@]}\" -e http://127.0.0.1:9997 -n \"$${XINF_FAMILY}\" -en vllm -f fp8 -s \"$${XINF_SIZE}\" -mp \"$${MODEL}\" -u \"$${SERVED_NAME}\" --context-length \"$${MAX_LEN}\" --gpu_memory_utilization \"$${GPU_FRAC}\" --max_model_len \"$${MAX_LEN}\" --max_num_seqs \"$${MAX_SEQS}\" --enable_prefix_caching true --kv_cache_dtype fp8 $${EXTRA_ARGS} || echo 'xinference launch failed; the server keeps running for the UI'; wait $$SRV"
    ports:
      - "127.0.0.1:${APP_PORT}:9997"
    environment:
      MODEL: "${MODEL}"
      SERVED_NAME: "${SERVED_NAME}"
      GPU_FRAC: "${GPU_FRAC}"
      MAX_LEN: "${MAX_LEN}"
      MAX_SEQS: "${MAX_SEQS}"
      SPEC_TOKENS: "${SPEC_TOKENS}"
      KV_CPU_GB: "${KV_CPU_GB}"
      EXTRA_ARGS: "${EXTRA_ARGS}"
      CHAT_TEMPLATE: "${CHAT_TEMPLATE}"
      HOME: "/data"
      HF_HOME: "/data/hf"
      XDG_CACHE_HOME: "/data/cache"
      HF_HUB_OFFLINE: "0"
      CUDA_MPS_PIPE_DIRECTORY: "/tmp/nvidia-mps"
      CUDA_MPS_PINNED_DEVICE_MEM_LIMIT: "${MPS_MEM_LIMIT}"
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: "${MPS_THREAD_PCT}"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: "0"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      XINF_FAMILY: "${XINF_FAMILY}"
      XINF_SIZE: "${XINF_SIZE}"
      XINF_VLLM: "${XINF_VLLM}"
      XINFERENCE_AUTH_ADVANCED: "0"
    volumes:
      - "${MODELS_DIR}:${MODELS_DIR}:ro"
      - "${APP_DATA_DIR}/data:/data"
      - "/tmp/nvidia-mps:/tmp/nvidia-mps"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    x-runtipi:
      is_main: true
      internal_port: 9997
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true

x-runtipi:
  schema_version: 2
