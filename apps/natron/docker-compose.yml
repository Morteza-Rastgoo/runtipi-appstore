services:
  natron:
    image: rodrigobrito/natron:2.3.15-RC12
    container_name: natron
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ${APP_DATA_DIR}/data/config:/home/natron/.config/Natron
    - ${APP_DATA_DIR}/data/projects:/home/natron/Projects
    - ${APP_DATA_DIR}/data/media:/home/natron/Media
    networks:
    - tipi_main_network
    labels:
      runtipi.managed: 'true'
networks:
  tipi_main_network:
    external: true
