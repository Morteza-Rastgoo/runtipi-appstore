# Infer: GPUStack (control plane) (gpustack/gpustack:v2.3.1) - generated by the engine-bakeoff app generator
# Loopback-only API, root (Docker socket), read-only model mounts, never auto-restarts.
services:
  infer-gpustack:
    image: gpustack/gpustack:v2.3.1
    container_name: infer-gpustack
    restart: "no"
    user: "0:0"
    ipc: host
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "exec /usr/bin/entrypoint.sh --port 80 --data-dir \"${APP_DATA_DIR}/data/gpustack\" --bootstrap-password \"$${GPUSTACK_ADMIN_PASSWORD}\" --enable-worker --disable-update-check"
    ports:
      - "127.0.0.1:${APP_PORT}:80"
    environment:
      GPUSTACK_ADMIN_PASSWORD: "${GPUSTACK_ADMIN_PASSWORD}"
    volumes:
      - "${MODELS_DIR}:${MODELS_DIR}:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${APP_DATA_DIR}/data/gpustack:${APP_DATA_DIR}/data/gpustack"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    x-runtipi:
      is_main: true
      internal_port: 80
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true

x-runtipi:
  schema_version: 2
